name: Monthly trend scan

on:
  schedule:
    - cron: "17 12 1 * *"   # 1st of each month, 12:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Scan economy
        run: python -m retirement trends
      - name: Commit results
        run: |
          git config user.name "trend-scan-bot"
          git config user.email "trend-scan-bot@users.noreply.github.com"
          git add data/trends reports/trends-*.md
          git diff --cached --quiet || git commit -m "Monthly trend scan $(date -u +%Y-%m-%d)"
          git push
